# Default values for morning-bot.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: bowofarjun/suprabhaat
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 10001

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: suprabhaat.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health/liveness
    port: http
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/readiness
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Persistent Volume for retaining WhatsApp Web LocalAuth session across restarts
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""
  mountPath: /app/.wwebjs_auth

# Application Configuration
env:
  nodeEnv: "production"
  cronSchedule: "0 7 * * *"
  cronTimezone: "Asia/Kolkata"
  dryRun: "false"
  recipientNumbers: ""
  geminiModel: "gemini-3.8-flash"

# Secrets (Mapped to K8s Secret)
secrets:
  geminiApiKey: ""
  fbPageId: ""
  fbPageAccessToken: ""

nodeSelector: {}
tolerations: []
affinity: {}
